{% extends "base.html" %}
{% block title %}Committee login{% endblock %}
{% block content %}
<div class="page-narrow" style="margin: 40px auto 0;">
  <div class="ticket">
    <p class="ticket-eyebrow">Committee access</p>
    <h1 class="ticket-title">Log in</h1>
    <p class="muted">Enter your registered email and we'll send you a one-time login link. No password needed.</p>

    <form method="post" action="{{ url_for('auth.login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="email">Email address</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required autofocus>
      <button type="submit" class="btn btn-block" style="margin-top: 20px;">Send login link</button>
    </form>
  </div>
</div>
{% endblock %}
